<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Drive Upload</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <script>
        // Tailwind Config to support custom colors if needed
        tailwind.config = {
            darkMode: 'class', // Enable class-based dark mode
        }
    </script>
    <style>
        body { font-family: 'Segoe UI', sans-serif; }
        /* Smooth transition for theme toggle */
        body, div, input, button, i { transition: background-color 0.3s, color 0.3s, border-color 0.3s; }
        .drag-active { border-color: #3b82f6 !important; background-color: #eff6ff !important; }
        /* Dark mode specific drag active */
        .dark .drag-active { background-color: #1f2937 !important; border-color: #60a5fa !important; }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen p-4 bg-gray-100 dark:bg-black text-gray-800 dark:text-gray-200">

    <div class="relative bg-white dark:bg-gray-900 rounded-2xl shadow-xl w-full max-w-lg p-8 transform transition-all hover:scale-[1.01]">
        
        <!-- Theme Toggle Button (Icon Only) -->
        <button id="themeToggle" class="absolute top-5 right-5 text-gray-500 dark:text-gray-400 hover:text-blue-500 dark:hover:text-yellow-400 focus:outline-none text-xl">
            <i class="fas fa-sun hidden dark:block"></i> <!-- Shows in Dark Mode (to switch to light) -->
            <i class="fas fa-moon dark:hidden"></i>    <!-- Shows in Light Mode (to switch to dark) -->
        </button>

        <div class="text-center mb-6">
            <h1 class="text-3xl font-bold tracking-tight text-gray-800 dark:text-white">File Upload</h1>
            <p class="text-gray-500 dark:text-gray-400 text-sm mt-1">Direct upload to Google Drive</p>
        </div>

        <form id="uploadForm" class="space-y-5">
            <!-- Name Input -->
            <div>
                <label class="block text-sm font-semibold mb-1 text-gray-700 dark:text-gray-300">Your Name</label>
                <div class="relative">
                    <i class="fas fa-user absolute left-3 top-3 text-gray-400"></i>
                    <input type="text" id="username" required placeholder="Enter your full name" 
                        class="w-full pl-10 pr-4 py-2 border border-gray-300 dark:border-gray-700 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none transition bg-gray-50 dark:bg-gray-800 dark:text-white dark:placeholder-gray-500 focus:bg-white dark:focus:bg-gray-800">
                </div>
            </div>

            <!-- File Description/Name Input -->
            <div>
                <label class="block text-sm font-semibold mb-1 text-gray-700 dark:text-gray-300">File Description</label>
                <div class="relative">
                    <i class="fas fa-tag absolute left-3 top-3 text-gray-400"></i>
                    <input type="text" id="about" placeholder="What are these files about?" 
                        class="w-full pl-10 pr-4 py-2 border border-gray-300 dark:border-gray-700 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none transition bg-gray-50 dark:bg-gray-800 dark:text-white dark:placeholder-gray-500 focus:bg-white dark:focus:bg-gray-800">
                </div>
            </div>

            <!-- Password Input -->
            <div>
                <label class="block text-sm font-semibold mb-1 text-gray-700 dark:text-gray-300">Access Password</label>
                <div class="relative">
                    <i class="fas fa-lock absolute left-3 top-3 text-gray-400"></i>
                    <input type="password" id="pass" placeholder="Enter password (if required)" 
                        class="w-full pl-10 pr-4 py-2 border border-gray-300 dark:border-gray-700 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none transition bg-gray-50 dark:bg-gray-800 dark:text-white dark:placeholder-gray-500 focus:bg-white dark:focus:bg-gray-800">
                </div>
            </div>

            <!-- Drag & Drop Area -->
            <div id="dropZone" class="border-2 border-dashed border-gray-300 dark:border-gray-600 rounded-xl p-8 text-center cursor-pointer transition duration-300 group hover:border-blue-400 dark:hover:border-blue-500 hover:bg-gray-50 dark:hover:bg-gray-800">
                <input type="file" id="fileInput" multiple required class="hidden">
                <div class="mb-3">
                    <i class="fas fa-cloud-upload-alt text-5xl text-blue-100 dark:text-gray-600 group-hover:text-blue-500 dark:group-hover:text-blue-400 transition duration-300"></i>
                </div>
                <p class="text-sm font-medium text-gray-600 dark:text-gray-300">Click to browse or drag files here</p>
                <p id="fileCount" class="text-xs text-blue-600 dark:text-blue-400 mt-2 font-bold min-h-[1.5em]"></p>
            </div>

            <!-- Remember Me -->
            <div class="flex items-center">
                <input type="checkbox" id="rememberMe" class="w-4 h-4 text-blue-600 border-gray-300 rounded focus:ring-blue-500 dark:bg-gray-700 dark:border-gray-600">
                <label for="rememberMe" class="ml-2 text-sm cursor-pointer text-gray-600 dark:text-gray-400">Remember Name & Password</label>
            </div>

            <!-- Submit Button -->
            <button type="submit" id="submitBtn" 
                class="w-full bg-gradient-to-r from-blue-600 to-blue-700 hover:from-blue-700 hover:to-blue-800 text-white font-bold py-3 rounded-lg shadow-lg transform transition active:scale-95 flex justify-center items-center gap-2">
                <span>Upload Files</span>
                <i class="fas fa-paper-plane"></i>
            </button>
        </form>

        <!-- Progress Area -->
        <div id="progressArea" class="hidden mt-6 space-y-3">
            <div class="w-full bg-gray-200 dark:bg-gray-700 rounded-full h-2">
                <div id="progressBar" class="bg-blue-600 h-2 rounded-full transition-all duration-3
