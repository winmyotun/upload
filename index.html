<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Secure Drive Upload</title>
    <!-- FontAwesome for Icons (Lightweight) -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    
    <style>
        /* --- 1. Pure CSS Variables & Reset --- */
        :root {
            --bg-color: #f3f4f6;
            --card-bg: #ffffff;
            --text-main: #1f2937;
            --text-sub: #6b7280;
            --border-color: #d1d5db;
            --input-bg: #f9fafb;
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --drag-bg: #eff6ff;
            --drag-border: #3b82f6;
        }

        /* Dark Mode Colors */
        html.dark {
            --bg-color: #000000;
            --card-bg: #111827;
            --text-main: #e5e7eb;
            --text-sub: #9ca3af;
            --border-color: #374151;
            --input-bg: #1f2937;
            --primary: #3b82f6;
            --primary-hover: #2563eb;
            --drag-bg: #1f2937;
            --drag-border: #60a5fa;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; outline: none; }
        
        body {
            font-family: 'Segoe UI', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
            transition: background-color 0.3s, color 0.3s;
        }

        /* --- 2. Card Design --- */
        .card {
            background-color: var(--card-bg);
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 480px;
            padding: 32px;
            position: relative;
            transition: transform 0.2s, background-color 0.3s;
        }

        .header { text-align: center; margin-bottom: 25px; }
        .header h1 { font-size: 28px; font-weight: 700; margin-bottom: 5px; }
        .header p { color: var(--text-sub); font-size: 14px; }

        /* --- 3. Form Elements --- */
        .form-group { margin-bottom: 20px; }
        .label { display: block; font-size: 14px; font-weight: 600; margin-bottom: 8px; color: var(--text-main); }
        
        .input-wrapper { position: relative; }
        .input-wrapper i {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: #9ca3af;
        }
        
        .form-input {
            width: 100%;
            padding: 12px 16px 12px 42px; /* Space for icon */
            background-color: var(--input-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: var(--text-main);
            font-size: 15px;
            transition: border-color 0.2s, background-color 0.3s;
        }
        
        .form-input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
        }

        /* --- 4. Drag & Drop Zone --- */
        .drop-zone {
            border: 2px dashed var(--border-color);
            border-radius: 12px;
            padding: 30px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
            background-color: transparent;
        }
        
        .drop-zone:hover, .drop-zone.drag-active {
            border-color: var(--primary);
            background-color: var(--drag-bg); /* Use slight tint */
        }
        
        .drop-zone i { font-size: 48px; color: var(--border-color); margin-bottom: 10px; transition: color 0.3s; }
        .drop-zone:hover i { color: var(--primary); }
        
        .drop-text { font-weight: 500; color: var(--text-sub); }
        .file-status { margin-top: 10px; font-size: 13px; font-weight: bold; color: var(--primary); min-height: 20px; }

        /* --- 5. Button & Toggles --- */
        .checkbox-wrapper { display: flex; align-items: center; margin-bottom: 20px; cursor: pointer; }
        .checkbox-wrapper input { width: 16px; height: 16px; margin-right: 8px; accent-color: var(--primary); }
        .checkbox-wrapper label { font-size: 14px; color: var(--text-sub); cursor: pointer; }

        .btn-submit {
            width: 100%;
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 14px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            transition: background-color 0.2s;
        }
        .btn-submit:hover { background-color: var(--primary-hover); }
        .btn-submit:disabled { opacity: 0.7; cursor: not-allowed; }

        /* Theme Toggle */
        .theme-btn {
            position: absolute;
            top: 20px;
            right: 20px;
            background: none;
            border: none;
            color: var(--text-sub);
            font-size: 20px;
            cursor: pointer;
            padding: 5px;
        }
        .theme-btn:hover { color: var(--primary); }

        /* Progress Bar */
        .progress-container { margin-top: 20px; display: none; }
        .progress-bar-bg { width: 100%; background-color: var(--border-color); height: 8px; border-radius: 4px; overflow: hidden; }
        .progress-bar-fill { height: 100%; background-color: var(--primary); width: 0%; transition: width 0.3s; }
        .progress-text { text-align: center; font-size: 12px; margin-top: 5px; color: var(--text-sub); }

        /* Result Message */
        .result-msg { margin-top: 15px; padding: 10px; border-radius: 8px; text-align: center; font-size: 14px; font-weight: 600; display: none; }
        .success { background-color: #d1fae5; color: #065f46; } /* Green */
        html.dark .success { background-color: #064e3b; color: #d1fae5; }
        .error { background-color: #fee2e2; color: #991b1b; } /* Red */
        html.dark .error { background-color: #7f1d1d; color: #fee2e2; }

        .hidden { display: none !important; }
    </style>
</head>
<body>

    <div class="card">
        <!-- Theme Toggle -->
        <button id="themeToggle" class="theme-btn">
            <i id="sunIcon" class="fas fa-sun hidden"></i>
            <i id="moonIcon" class="fas fa-moon"></i>
        </button>

        <div class="header">
            <h1>File Upload</h1>
            <p>Direct upload to Google Drive</p>
        </div>

        <form id="uploadForm">
            <!-- Name Input -->
            <div class="form-group">
                <label class="label">Your Name</label>
                <div class="input-wrapper">
                    <i class="fas fa-user"></i>
                    <input type="text" id="username" class="form-input" required placeholder="Enter your full name">
                </div>
            </div>

            <!-- Description Input -->
            <div class="form-group">
                <label class="label">File Description</label>
                <div class="input-wrapper">
                    <i class="fas fa-tag"></i>
                    <input type="text" id="about" class="form-input" placeholder="What are these files about?">
                </div>
            </div>

            <!-- Password Input -->
            <div class="form-group">
                <label class="label">Access Password</label>
                <div class="input-wrapper">
                    <i class="fas fa-lock"></i>
                    <input type="password" id="pass" class="form-input" placeholder="Enter password (if required)">
                </div>
            </div>

            <!-- Drag & Drop -->
            <div id="dropZone" class="drop-zone">
                <input type="file" id="fileInput" multiple required class="hidden" style="display:none;">
                <i class="fas fa-cloud-upload-alt"></i>
                <p class="drop-text">Click to browse or drag files here</p>
                <p id="fileCount" class="file-status"></p>
            </div>

            <!-- Remember Me -->
            <div class="checkbox-wrapper" style="margin-top: 15px;">
                <input type="checkbox" id="rememberMe">
                <label for="rememberMe">Remember Name & Password</label>
            </div>

            <!-- Submit Button -->
            <button type="submit" id="submitBtn" class="btn-submit">
                <span>Upload Files</span>
                <i class="fas fa-paper-plane"></i>
            </button>
        </form>

        <!-- Progress Area -->
        <div id="progressArea" class="progress-container">
            <div class="progress-bar-bg">
                <div id="progressBar" class="progress-bar-fill"></div>
            </div>
            <p id="statusText" class="progress-text">Preparing...</p>
        </div>

        <!-- Result Message -->
        <div id="resultMessage" class="result-msg"></div>
    </div>

    <script>
        // ******************************************************
        // REPLACE THIS URL WITH YOUR GOOGLE APPS SCRIPT WEB APP URL
        const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbx5DUIpMA0UrDeJ9OJEyyJJyGXqGydCAQRKW-JyssL6nNc4TmLoLBlA-EojEvC98gOHgQ/exec';
        // ******************************************************

        // --- Theme Toggle Logic ---
        const toggleBtn = document.getElementById('themeToggle');
        const sunIcon = document.getElementById('sunIcon');
        const moonIcon = document.getElementById('moonIcon');
        const htmlElement = document.documentElement;

        function updateThemeIcons(isDark) {
            if (isDark) {
                sunIcon.classList.remove('hidden');
                moonIcon.classList.add('hidden');
            } else {
                sunIcon.classList.add('hidden');
                moonIcon.classList.remove('hidden');
            }
        }

        // Initialize Theme (Default to Dark)
        if (localStorage.theme === 'light') {
            htmlElement.classList.remove('dark');
            updateThemeIcons(false);
        } else {
            htmlElement.classList.add('dark');
            updateThemeIcons(true);
        }

        toggleBtn.addEventListener('click', (e) => {
            e.preventDefault(); // Prevent form submit if inside form
            if (htmlElement.classList.contains('dark')) {
                htmlElement.classList.remove('dark');
                localStorage.theme = 'light';
                updateThemeIcons(false);
            } else {
                htmlElement.classList.add('dark');
                localStorage.theme = 'dark';
                updateThemeIcons(true);
            }
        });

        // --- Upload Logic ---
        const dropZone = document.getElementById('dropZone');
        const fileInput = document.getElementById('fileInput');
        const fileCount = document.getElementById('fileCount');
        const form = document.getElementById('uploadForm');
        const submitBtn = document.getElementById('submitBtn');
        const progressArea = document.getElementById('progressArea');
        const progressBar = document.getElementById('progressBar');
        const statusText = document.getElementById('statusText');
        const resultMessage = document.getElementById('resultMessage');

        document.addEventListener('DOMContentLoaded', () => {
            const savedPass = localStorage.getItem('driveUploadPass');
            const savedName = localStorage.getItem('driveUploadName');
            if(savedPass) { document.getElementById('pass').value = savedPass; }
            if(savedName) { document.getElementById('username').value = savedName; }
            if(savedPass || savedName) { document.getElementById('rememberMe').checked = true; }
        });

        // Drag & Drop
        ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(eventName => {
            dropZone.addEventListener(eventName, preventDefaults, false);
        });
        function preventDefaults(e) { e.preventDefault(); e.stopPropagation(); }

        ['dragenter', 'dragover'].forEach(eventName => {
            dropZone.addEventListener(eventName, highlight, false);
        });
        ['dragleave', 'drop'].forEach(eventName => {
            dropZone.addEventListener(eventName, unhighlight, false);
        });
        function highlight() { dropZone.classList.add('drag-active'); }
        function unhighlight() { dropZone.classList.remove('drag-active'); }

        dropZone.addEventListener('drop', handleDrop, false);
        function handleDrop(e) {
            const dt = e.dataTransfer;
            fileInput.files = dt.files;
            updateFileCount();
        }

        dropZone.addEventListener('click', () => fileInput.click());
        fileInput.addEventListener('change', updateFileCount);

        function updateFileCount() {
            const count = fileInput.files.length;
            fileCount.textContent = count > 0 ? `${count} file(s) selected` : '';
        }

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            if(fileInput.files.length === 0) {
                showResult('Please select at least one file.', 'error');
                return;
            }

            const remember = document.getElementById('rememberMe').checked;
            const pass = document.getElementById('pass').value;
            const name = document.getElementById('username').value;
            
            if(remember) {
                localStorage.setItem('driveUploadPass', pass);
                localStorage.setItem('driveUploadName', name);
            } else {
                localStorage.removeItem('driveUploadPass');
                localStorage.removeItem('driveUploadName');
            }

            submitBtn.disabled = true;
            submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Processing...';
            progressArea.style.display = 'block';
            resultMessage.style.display = 'none';
            
            const files = Array.from(fileInput.files);
            const totalFiles = files.length;
            let successCount = 0;

            for (let i = 0; i < totalFiles; i++) {
                const file = files[i];
                statusText.innerText = `Uploading ${i + 1} of ${totalFiles}: ${file.name}...`;
                
                try {
                    const base64 = await toBase64(file);
                    const payload = {
                        password: pass,
                        name: name,
                        about: document.getElementById('about').value,
                        files: [{
                            name: file.name,
                            fileName: file.name,
                            mimeType: file.type,
                            data: base64
                        }]
                    };

                    const response = await fetch(SCRIPT_URL, {
                        method: 'POST',
                        body: JSON.stringify(payload)
                    });
                    
                    const result = await response.json();
                    
                    if(result.success) {
                        successCount++;
                        const percent = ((successCount / totalFiles) * 100).toFixed(0);
                        progressBar.style.width = `${percent}%`;
                    } else {
                        throw new Error(result.error);
                    }

                } catch (err) {
                    console.error(err);
                    showResult(`Error: ${err.message}`, 'error');
                    submitBtn.disabled = false;
                    submitBtn.innerHTML = '<span>Retry Upload</span><i class="fas fa-redo"></i>';
                    return;
                }
            }

            statusText.innerText = "Completed!";
            showResult(`Successfully uploaded ${successCount} files!`, 'success');
            form.reset();
            fileCount.textContent = '';
            submitBtn.disabled = false;
            submitBtn.innerHTML = '<span>Upload Files</span><i class="fas fa-paper-plane"></i>';
            setTimeout(() => { progressArea.style.display = 'none'; progressBar.style.width = '0%'; }, 5000);
        });

        const toBase64 = file => new Promise((resolve, reject) => {
            const reader = new FileReader();
            reader.readAsDataURL(file);
            reader.onload = () => resolve(reader.result.split(',')[1]);
            reader.onerror = error => reject(error);
        });

        function showResult(msg, type) {
            resultMessage.textContent = msg;
            resultMessage.style.display = 'block';
            resultMessage.className = 'result-msg ' + type;
        }
    </script>
</body>
</html>
